# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy Demo API

on:
  push:
    branches:
      - demo
    paths:
      - "VentureHerdManager.Api/**"
      - ".github/workflows/demo-api.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build VentureHerdManager.Api/VentureHerdManager.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish VentureHerdManager.Api/VentureHerdManager.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_834846F655154FD2B2367AF471B74BFC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_42FA626C45354D3BB3461FCEBCD0838D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F9A546A8675146939A9EC31824FDA1B2 }}

      - name: Configure private herd data access
        uses: azure/cli@v2
        env:
          HERD_DATA_ADMIN_KEY: ${{ secrets.HERD_DATA_ADMIN_KEY }}
        with:
          inlineScript: >
            az webapp config appsettings set
            --resource-group VentureHerdMananger
            --name Demo-API-123
            --settings HerdDataImport__AdminKey="$HERD_DATA_ADMIN_KEY"

      - name: Configure API startup
        uses: azure/cli@v2
        with:
          inlineScript: >
            az webapp config set
            --resource-group VentureHerdMananger
            --name Demo-API-123
            --startup-file "dotnet VentureHerdManager.Api.dll"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Demo-API-123'
          slot-name: 'Production'
          package: .
          
