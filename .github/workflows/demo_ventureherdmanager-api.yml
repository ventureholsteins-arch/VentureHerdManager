name: Build and deploy ASP.Net Core app to Azure Web App - Demo-API-123

on:
  push:
    branches:
      - demo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./VentureHerdManager.Api/VentureHerdManager.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./VentureHerdManager.Api/VentureHerdManager.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0596ABFD33F54FBDA9A58CAF20900832 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D78FB7DACD0946FEA8F017DF05374B9B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_63D653580DE349A1B7620A3C63379341 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Demo-API-123'
          slot-name: 'Production'
          package: .