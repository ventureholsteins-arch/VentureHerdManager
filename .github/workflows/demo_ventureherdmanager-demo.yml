name: Deploy Demo Site

on:
  push:
    branches:
      - demo

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Demo
    steps:
      - uses: actions/checkout@v3

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_DEMO_ONLY: "true"
          VITE_API_URL: "https://Demo-API-123.azurewebsites.net/api"
          VITE_DEMO_KEY: ${{ secrets.DEMO_SEED_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEMO }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./VentureHerdManager.Web"
          api_location: ""
          output_location: "dist"
