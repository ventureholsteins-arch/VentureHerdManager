name: Deploy Demo Site

on:
  push:
    branches:
      - demo
    paths:
      - "VentureHerdManager.Web/**"
      - ".github/workflows/demo_ventureherdmanager-demo.yml"

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        env:
          VITE_DEMO_ONLY: "true"
          VITE_API_URL: "https://demo-api-123-bzhkaphmgke0gvf5.centralus-01.azurewebsites.net/api"
          VITE_DEMO_RESET_ENABLED: "true"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEMO }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./VentureHerdManager.Web"
          api_location: ""
          output_location: "dist"
