# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ventureherdmanager-api

on:
  push:
    branches:
      - main
    paths:
      - "VentureHerdManager.Api/**"
      - ".github/workflows/main_ventureherdmanager-api.yml"
  workflow_dispatch:
    inputs:
      apply_paper_records:
        description: 'Apply the bundled paper-record reconciliation after deployment'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build VentureHerdManager.Api/VentureHerdManager.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish VentureHerdManager.Api/VentureHerdManager.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_265FF0F656EF47FBBF9E835F11A0D45B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0F4DB77FC3974DDEBD9612AD32C69E84 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68D5FF2F7C4F4A2680AD4B782F204519 }}

      - name: Configure private herd data access
        uses: azure/cli@v2
        env:
          HERD_DATA_ADMIN_KEY: ${{ secrets.HERD_DATA_ADMIN_KEY }}
        with:
          inlineScript: >
            az webapp config appsettings set
            --resource-group VentureHerdMananger
            --name ventureherdmanager-api
            --settings HerdDataImport__AdminKey="$HERD_DATA_ADMIN_KEY" WEBSITE_RUN_FROM_PACKAGE="1"

      - name: Configure API startup
        uses: azure/cli@v2
        with:
          inlineScript: >
            az webapp config set
            --resource-group VentureHerdMananger
            --name ventureherdmanager-api
            --startup-file "dotnet VentureHerdManager.Api.dll"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ventureherdmanager-api'
          slot-name: 'Production'
          package: .

      - name: Restart API on the new package
        uses: azure/cli@v2
        with:
          inlineScript: az webapp restart --resource-group VentureHerdMananger --name ventureherdmanager-api

      - name: Open controlled paper-record import window
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_paper_records }}
        uses: azure/cli@v2
        with:
          inlineScript: >
            az webapp config appsettings set
            --resource-group VentureHerdMananger
            --name ventureherdmanager-api
            --settings PaperRecordImport__AllowApply="true"

      - name: Apply paper-record reconciliation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_paper_records }}
        env:
          HERD_DATA_ADMIN_KEY: ${{ secrets.HERD_DATA_ADMIN_KEY }}
        run: |
          api_url="https://ventureherdmanager-api-gkgscwf2e6dte8dg.centralus-01.azurewebsites.net"
          for attempt in {1..30}; do
            status=$(curl --silent --output paper-import-report.json --write-out "%{http_code}" \
              --request POST \
              --header "X-Herd-Admin-Key: ${HERD_DATA_ADMIN_KEY}" \
              "${api_url}/api/paper-record-import/apply" || true)
            if [ "$status" = "200" ]; then
              cat paper-import-report.json
              exit 0
            fi
            if [ "$status" = "500" ]; then
              echo "Paper import returned a server error:"
              cat paper-import-report.json || true
              exit 1
            fi
            echo "Paper import is waiting for the API (attempt ${attempt}, HTTP ${status})."
            sleep 10
          done
          cat paper-import-report.json || true
          exit 1

      - name: Close controlled paper-record import window
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.apply_paper_records }}
        uses: azure/cli@v2
        with:
          inlineScript: >
            az webapp config appsettings set
            --resource-group VentureHerdMananger
            --name ventureherdmanager-api
            --settings PaperRecordImport__AllowApply="false"
          
